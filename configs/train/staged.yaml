# Stage-wise geometry-supervised training. The paper states three facts only: training is multi-stage,
# trainable components are activated progressively, and the FINAL stage uses 1,143 clips from six
# reconstruction datasets. Per-stage budgets/optimisers are appendix content -> marked `verify`.
seed: 0
output_dir: runs/l4ar
device: cuda        # switch to cpu for smoke tests
resume: null

stages:
  - name: stage1_adapter
    activate: [alignment]                     # trainable: A_phi only
    data: configs/data/clips_final.yaml
    steps: 20000                              # verify
    batch_size: null                            # null -> the dataset config decides (clips may differ in length)
    gradient_accumulation: 4                  # verify
    lr: 1.0e-4                                # verify
    lr_scheduler: cosine
    warmup_steps: 1000                        # verify
    weight_decay: 0.01
    gradient_clip: 1.0
    freeze: [refinement_base, heads, vae, video_models]
    notes: "4RC-aligned latent adapter warm-up; protects the pretrained geometric prior"

  - name: stage2_heads
    activate: [alignment, decoder_heads]
    data: configs/data/clips_final.yaml
    steps: 20000                              # verify
    batch_size: null
    lr: 1.0e-4
    lr_scheduler: cosine
    weight_decay: 0.01
    gradient_clip: 1.0
    init_from: stage1_adapter

  - name: stage3_lora
    activate: [alignment, decoder_heads, refinement_lora]   # paper: rank-16 LoRA on the hierarchy
    data: configs/data/clips_final.yaml
    clips: 1143                               # paper: final stage clip count
    steps: 40000                              # verify
    batch_size: null
    lr: 2.0e-5                                # verify (lower for adapter updates)
    lora_lr_scale: 5.0                        # verify
    lr_scheduler: cosine
    weight_decay: 0.01
    gradient_clip: 1.0
    init_from: stage2_heads

loss:
  depth_weight: 1.0
  depth_gradient_weight: 1.0
  ray_weight: 1.0
  camera_translation_weight: 1.0
  camera_rotation_weight: 1.0
  camera_fov_weight: 0.5
  point_weight: 1.0
  point_tail_weight: 0.5
  normal_weight: 1.0
  tail_quantile: 0.9

checkpoint_every: 2000
log_every: 50
num_workers: 8
