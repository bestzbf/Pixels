# Paper-scale L4AR configuration (arXiv:2608.10744). Dimensions that the main text does not state are
# marked `verify` and listed in docs/PAPER_ANALYSIS.md section 8.
model:
  token_dim: 1024          # verify: 4RC hierarchy width
  heads: 16                # verify
  depth: 31                # paper: "31-block refinement hierarchy"
  mlp_ratio: 4.0
  drop_path: 0.0           # verify
  patch_size: 2            # verify: latent-grid -> token-grid stride of S_phi
  align_kernel: [1, 2, 2]  # learned local 3D convolution S_phi
  grid_mode: trilinear     # fixed resampler R
  use_local_conv: true
  tap_after: [6, 13, 20, 27, 30]   # verify: multi-level depths (DINOv2-style quartiles)
  initial_frame_blocks: 1  # paper: per-frame structure first, then alternate
  scope_policy: full       # full | frame_only (w/o Global) | global_only (w/o Frame)
  lora_rank: 16            # paper: rank-16 LoRA on the refinement hierarchy
  lora_alpha: 32
  geometry_hidden: 256     # verify
  camera_hidden: 512       # verify
  camera_encoding_dim: 9   # paper: 9D pose-FOV camera parameterization
  ray_space: world         # world-space ray directions (Eq. 6)
  use_camera_tokens: true  # frozen camera tokens  } reused from 4RC
  use_time_tokens: true    # frozen time tokens    }
  vae:
    name: wan2.1-vae
    backend: wan
    checkpoint_id: /mnt/data/pixels-weights/wan-vae   # ModelScope Wan2.1-T2V-1.3B-Diffusers, vae/ subfolder
    channels: 16
    spatial_compression: 8
    temporal_compression: 4
    scaling: 1.0
    shift: 0.0
    layout: "B,C,T,H,W"
    latents_mean: [-0.7571, -0.7089, -0.9113, 0.1075, -0.1745, 0.9653, -0.1517, 1.5508, 0.4134, -0.0715, 0.5517, -0.3632, -0.1922, -0.9497, 0.2503, -0.2921]
    latents_std: [2.8184, 1.4541, 2.3275, 2.6558, 1.2196, 1.7708, 2.6052, 2.0743, 3.2687, 2.1526, 2.8652, 1.5579, 1.6382, 1.1253, 2.8251, 1.916]

pretrained_init:
  source: 4RC               # initialize hierarchy + heads from the pretrained 4D reconstructor
  # Luo-Yihang/4RC on the HF mirror = "4RC: 4D Reconstruction via Conditional Querying Anytime and
  # Anywhere", arXiv:2602.10094 -- the paper's (Luo et al. 2026). 6.08 GB, single safetensors.
  repo: Luo-Yihang/4RC
  checkpoint: /mnt/data/pixels-weights/4rc/model.safetensors
  strict: false
  adapter_from_4rc_aligned_latent: true   # paper: "Starting from a 4RC-aligned latent adapter"

frozen_components:
  - video_generators
  - vae
  - refinement_base_weights      # original Transformer weights
  - camera_tokens
  - time_tokens
  - motion_decoder
  - tracking_head
