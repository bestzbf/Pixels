# Paper-scale L4AR configuration (arXiv:2608.10744).
#
# Architecture values are read off the upstream 4RC source (github.com/Luo-Yihang/4RC, ICML 2026),
# the reconstructor this paper initialises from:
#   arc/models/arc/arc.py            DinoV2(name="vitg", out_layers=[19,27,33,39], alt_start=13,
#                                      qknorm_start=13, rope_start=13, cat_token=True, has_time_token=True)
#                                    DualDPT(dim_in=3072, features=256), CameraDec(dim_in=3072),
#                                    MotionDecoder(embed_dim=1536, depth=4)   <- frozen per the paper
#   arc/models/arc/heads/cam_dec.py  pose_enc = cat([t(3), qvec(4), fov(2)]), ReLU on fov
#   arc/models/arc/dinov2/dinov2.py  "vitg" = vit_giant2: width 1536, 40 blocks, 24 heads, patch 14
model:
  token_dim: 1536              # vit_giant2 width, read off the 4RC source (was a 1024 guess)
  heads: 24                    # 1536 / 64 per head
  depth: 40                    # vit_giant2 depth; the paper's "31-block" is the late/alternating
  #                          subset (alt_start=13 -> 28) plus the 4-block motion decoder
  mlp_ratio: 2.6666667      # vit_giant2 FFN hidden = 4096 = 8/3 * 1536 (SwiGLU), so fc1/fc2 shapes load
  drop_path: 0.0
  patch_size: 2            # S_phi stride on the latent lattice; 4RC's image patch is 14, so our
  #                          token grid is coarser - a deliberate deviation, not an unknown
  align_kernel: [1, 2, 2]  # learned local 3D convolution S_phi
  grid_mode: trilinear     # fixed resampler R
  use_local_conv: true
  tap_after: [18, 26, 32, 38]      # 0-based form of 4RC out_layers=[19,27,33,39]
  initial_frame_blocks: 13 # 4RC alt_start=13: frame-wise up to block 12, then alternate
  scope_policy: full       # full | frame_only (w/o Global) | global_only (w/o Frame)
  lora_rank: 16            # paper: rank-16 LoRA on the refinement hierarchy
  lora_alpha: 32
  geometry_hidden: 256         # DualDPT features=256
  camera_hidden: 512       # upstream CameraDec hides at dim_in/2; not stated for our variant
  camera_encoding_dim: 9       # verified: translation(3)+quaternion(4)+fov(2), ReLU on fov
  ray_space: world         # world-space ray directions (Eq. 6)
  use_camera_tokens: true  # 4RC cat_token=True
  use_time_tokens: true    # 4RC has_time_token=True
  vae:
    name: wan2.1-vae
    backend: wan
    checkpoint_id: /mnt/data/pixels-weights/wan-vae   # ModelScope Wan2.1-T2V-1.3B-Diffusers, vae/ subfolder
    channels: 16
    spatial_compression: 8
    temporal_compression: 4
    scaling: 1.0
    shift: 0.0
    layout: "B,C,T,H,W"
    latents_mean: [-0.7571, -0.7089, -0.9113, 0.1075, -0.1745, 0.9653, -0.1517, 1.5508, 0.4134, -0.0715, 0.5517, -0.3632, -0.1922, -0.9497, 0.2503, -0.2921]
    latents_std: [2.8184, 1.4541, 2.3275, 2.6558, 1.2196, 1.7708, 2.6052, 2.0743, 3.2687, 2.1526, 2.8652, 1.5579, 1.6382, 1.1253, 2.8251, 1.916]

pretrained_init:
  source: 4RC               # initialize hierarchy + heads from the pretrained 4D reconstructor
  # Luo-Yihang/4RC on the HF mirror = "4RC: 4D Reconstruction via Conditional Querying Anytime and
  # Anywhere", arXiv:2602.10094 -- the paper's (Luo et al. 2026). 6.08 GB, single safetensors.
  repo: Luo-Yihang/4RC
  checkpoint: /mnt/data/pixels-weights/4rc/model.safetensors
  strict: false
  adapter_from_4rc_aligned_latent: true   # paper: "Starting from a 4RC-aligned latent adapter"

frozen_components:
  - video_generators
  - vae
  - refinement_base_weights      # original Transformer weights
  - camera_tokens
  - time_tokens
  - motion_decoder
  - tracking_head
